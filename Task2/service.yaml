apiVersion: v1
kind: Service
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  type: NodePort          # NodePort — чтобы minikube service мог дать нам URL
  selector:
    app: scaletestapp
  ports:
    - protocol: TCP
      port: 8080          # порт сервиса внутри кластера
      targetPort: 8080    # порт контейнера
