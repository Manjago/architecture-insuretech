apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp

  minReplicas: 1
  maxReplicas: 10

  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second    # имя из Prometheus Adapter (rate от http_requests_total)
        target:
          type: AverageValue
          averageValue: "5"                 # масштабировать при > 5 RPS на под
