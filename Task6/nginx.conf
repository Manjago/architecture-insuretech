# =============================================================================
#  Nginx Configuration — Rate Limiting
#  InsureTech / Sprint 8 / Task 6
#
#  Проблема: один из партнёров генерирует аномально высокий трафик,
#  снижая производительность API для остальных потребителей.
#
#  Решение: Rate Limiting на уровне Nginx (первый рубеж обороны).
#
#  Параметры:
#    - Лимит: 10 запросов в минуту на IP-адрес
#    - Burst: 5 (кратковременный всплеск до 5 запросов сверх лимита)
#    - Превышение: HTTP 429 Too Many Requests
#    - Алгоритм: Leaky Bucket
#
#  Примечание: это инфраструктурный уровень защиты (по IP).
#  Для бизнес-лимитов по API key / партнёру рекомендуется
#  дополнительный application-level rate limiting (Bucket4j + Redis).
#  См. Resilience Patterns 101 → "Rate Limiting в распределённой среде".
# =============================================================================

http {
    # =========================================================================
    #  Rate Limiting Zone
    # =========================================================================
    #
    #  limit_req_zone — определяет зону разделяемой памяти для хранения
    #  счётчиков запросов.
    #
    #  $binary_remote_addr — ключ: IP-адрес клиента в бинарном формате
    #                        (занимает 4 байта для IPv4 вместо ~15 у строки).
    #
    #  zone=api_limit:10m  — имя зоны "api_limit", размер 10 МБ.
    #                        1 МБ ≈ 16 000 IP-адресов, 10 МБ ≈ 160 000.
    #
    #  rate=10r/m           — допустимая скорость: 10 запросов в минуту
    #                        (эквивалентно ~1 запрос в 6 секунд).
    #
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # =================================================================
            #  Rate Limiting
            # =================================================================
            #
            #  limit_req zone=api_limit — применяем зону api_limit.
            #
            #  burst=5 — разрешаем «всплеск» до 5 запросов сверх лимита.
            #    Запросы сверх rate, но в пределах burst, ставятся в очередь
            #    и обрабатываются с задержкой (алгоритм Leaky Bucket).
            #    Это сглаживает кратковременные пики, не отклоняя запросы сразу.
            #    Без burst — любое превышение rate мгновенно отклоняется.
            #
            #  Примечание: параметр nodelay НЕ используется намеренно.
            #    С nodelay burst-запросы обрабатывались бы мгновенно, что
            #    позволило бы отправить 15 запросов залпом (10 rate + 5 burst).
            #    Без nodelay — burst-запросы распределяются во времени,
            #    обеспечивая более равномерную нагрузку на backend.
            #
            limit_req zone=api_limit burst=5;

            # Возвращаем 429 Too Many Requests вместо дефолтного 503
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}
