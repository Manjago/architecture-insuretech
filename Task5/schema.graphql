# =============================================================================
#  GraphQL Schema — client-info service
#  InsureTech / Sprint 8 / Task 5
#
#  Замена REST API (Swagger 2.0) на GraphQL для решения проблем
#  overfetching (500 атрибутов клиента) и underfetching (3 отдельных
#  REST-эндпоинта для получения связанных данных).
#
#  REST (As-Is):                         GraphQL (To-Be):
#    GET /clients/{id}          →  ┐
#    GET /clients/{id}/documents →  ├─  query { client(id: "...") { ... } }
#    GET /clients/{id}/relatives →  ┘
#
#  Клиент запрашивает ровно те поля, которые нужны в конкретном сценарии.
#  Один запрос вместо трёх. Никаких лишних данных.
# =============================================================================

# -----------------------------------------------------------------------------
#  Типы (Types)
# -----------------------------------------------------------------------------

"""
Клиент InsureTech.
В production-карточке клиента до 500 атрибутов — GraphQL позволяет
запрашивать только нужные в каждом конкретном сценарии.
"""
type Client {
  "Уникальный идентификатор клиента"
  id: ID!

  "ФИО клиента"
  name: String!

  "Возраст клиента"
  age: Int

  """
  Документы клиента (паспорт, ВУ, полисы и др.).
  Resolver вызывается только если поле запрошено клиентом —
  лишнего запроса к БД не будет.
  """
  documents: [Document!]!

  """
  Родственники клиента.
  Используется, например, при оформлении мультидрайв-ОСАГО.
  """
  relatives: [Relative!]!
}

"""
Документ клиента (паспорт, водительское удостоверение, полис и др.).
"""
type Document {
  "Уникальный идентификатор документа"
  id: ID!

  "Тип документа (passport, driver_license, insurance_policy и др.)"
  type: String!

  "Номер документа"
  number: String!

  "Дата выдачи (ISO 8601)"
  issueDate: String

  "Дата окончания действия (ISO 8601)"
  expiryDate: String
}

"""
Родственник клиента.
"""
type Relative {
  "Уникальный идентификатор записи"
  id: ID!

  "Тип родственной связи (spouse, child, parent и др.)"
  relationType: String!

  "ФИО родственника"
  name: String!

  "Возраст родственника"
  age: Int
}

# -----------------------------------------------------------------------------
#  Запросы (Queries)
# -----------------------------------------------------------------------------

type Query {
  """
  Получить клиента по ID.

  Покрывает все три REST-эндпоинта:
    GET /clients/{id}
    GET /clients/{id}/documents
    GET /clients/{id}/relatives

  Клиент сам выбирает, какие поля и связи запросить.

  Примеры:

  # Только имя (список клиентов на витрине):
  query { client(id: "123") { name } }

  # Оформление страховки (имя + паспорт):
  query {
    client(id: "123") {
      name
      age
      documents { type number }
    }
  }

  # ОСАГО — мультидрайв (клиент + ВУ + родственники):
  query {
    client(id: "123") {
      name
      age
      documents { type number expiryDate }
      relatives { name age relationType }
    }
  }
  """
  client(id: ID!): Client
}
